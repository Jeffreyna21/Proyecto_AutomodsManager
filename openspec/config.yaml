      available: false
      tool: none
    type_checker:
      available: false
      tool: none
    formatter:
      available: false
      tool: none
  existing_tests:
    files:
      - tests/analisisService.test.js
      - tests/placaValidator.test.js
    total_tests: 15
    notes: >-
      Tests cover pure service functions (analisisService.calcularMetricas,
      placaValidator.validarFormato, placaValidator.validarUnicidad). No
      database-touching tests yet. sql.js requires buffer-based initialization
      in tests — consider a helper that exports a fresh in-memory DB per suite.

# Per-phase rules consumed by sdd-* skills.
rules:
  proposal:
    - Include a rollback plan for any change that touches the database schema (sql.js migrations are manual).
    - Respect MVC boundaries: controllers call services, services use models, never the reverse.
    - New features that touch `src/views` MUST also update or add at least one E2E-style flow test under `tests/`.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Each domain spec lives under `openspec/changes/{change-name}/specs/{domain}/spec.md`.
  design:
    - Include sequence diagrams for request lifecycles that cross more than two MVC layers.
    - Document sql.js persistence decisions explicitly: in-memory buffer + saveDB() race conditions, transaction boundaries, indexes.
    - When introducing a new dependency, document why it is needed and the impact on `pnpm-lock.yaml`.
  tasks:
    - Group by phase, use hierarchical numbering (1, 1.1, 1.2, …).
    - Keep individual tasks completable in one session (< 400 lines of diff per task).
    - Each task MUST list the tests it adds or modifies.
  apply:
    - Follow existing CommonJS / require() patterns — do not introduce ESM or TypeScript without explicit approval.
    - Run `node --test tests/*.test.js` after each task; failing tests block progress (RED-GREEN-REFACTOR).
    - Never edit generated `database/automods.db` directly — always go through `initDB()` and `saveDB()`.
    tdd: true
    test_command: node --test tests/*.test.js
  verify:
    test_command: node --test tests/*.test.js
    build_command: node -c server.js
    coverage_command: ""
    coverage_threshold: 0
    acceptance:
      - All node:test assertions pass.
      - No new ESLint/Prettier debt (none configured today — propose adding if change is non-trivial).
      - Manual smoke test of affected routes via `pnpm start`.
  archive:
    - Warn before merging any delta that includes a REMOVED requirement.
    - Archive folder name: `openspec/changes/archive/YYYY-MM-DD-{change-name}/`.
