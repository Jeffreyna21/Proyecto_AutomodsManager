# Source of truth for SDD phase rules, stack, and testing capabilities.

schema: spec-driven

project: proyecto_automodsmanager

# Concise context — keep under 10 lines per openspec convention.
context: |
  AutoMods Manager: CRUD app for vehicles and modifications with auth.
  Stack: Node.js 18+, Express 5, EJS views, SQLite via sql.js.
  Architecture: MVC — src/{controllers,models,services,middlewares,routes,views,config}.
  Auth: bcryptjs + express-session + connect-flash; method-override for PUT/DELETE.
  Client libs: Chart.js 4 (loaded from CDN, not in npm deps).
  Tests: node:test runner, 2 files / 15 tests, strict TDD.
  Package manager: pnpm@10.18.1 (pnpm-workspace.yaml present — monorepo intent).

persistence: openspec

strict_tdd: true

# Detected stack — used by phase skills to make framework-aware suggestions.
stack:
  runtime: node@18+
  framework: express@5.2.1
  view_engine: ejs@5.0.1
  database: sqlite-via-sql.js@1.14.1
  auth: bcryptjs@3 + express-session@1.19 + connect-flash@0.1
  package_manager: pnpm@10.18.1
  test_runner: node:test
  client_libraries:
    - chart.js@4 (CDN, src/views/autos/analisis.ejs)

# Testing capabilities — used by sdd-apply (RED-GREEN-REFACTOR) and sdd-verify.
testing:
