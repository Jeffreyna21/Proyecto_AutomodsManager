services:
  - type: web
    name: automods-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter web build
    startCommand: node server.js
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: '10000'
      - key: DATABASE_PATH
        value: /tmp/automods.db
    healthCheckPath: /health

  # El SPA React se sirve desde el mismo backend Express bajo /app/*
  # (configurado en src/app.js con express.static sobre apps/web/dist).
  # No hace falta un segundo servicio: type: static no es un tipo válido
  # en Render Blueprint.
