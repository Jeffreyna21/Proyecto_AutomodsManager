services:
  - type: web
    name: automods-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter web build
    startCommand: node server.js
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: '10000'
      - key: DATABASE_PATH
        value: /tmp/automods.db
    healthCheckPath: /api/v1/auth/me

  - type: static
    name: automods-spa
    runtime: static
    rootDir: apps/web
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
